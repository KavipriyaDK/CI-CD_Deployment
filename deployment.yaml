apiVersion: apps/v1
kind: Deployment
metadata:
  name: placement-portal
spec:
  replicas: 2
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: placement-portal
  template:
    metadata:
      labels:
        app: placement-portal
    spec:
      containers:
      - name: web
        image: YOUR_DH_USER/placement-portal:v1
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: placement-portal-svc
spec:
  type: NodePort
  selector:
    app: placement-portal
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30007